name: CI

on:
  push:
    branches:
      - main
      - dev_*
  pull_request:
    branches:
      - main
      - dev_*

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Lint & Build (iOS Simulator)
    runs-on: macos-15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version

      - name: Cache Swift Packages
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/Abstrakt-*/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved', '**/*.xcodeproj/**') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Run SwiftLint
        run: |
          if command -v swiftlint >/dev/null 2>&1; then
            swiftlint lint --strict
          else
            echo "Installing SwiftLint via Homebrew..."
            brew install swiftlint
            swiftlint lint --strict
          fi

      - name: Build App & Widget Extension
        run: |
          xcodebuild build \
            -project Abstrakt.xcodeproj \
            -scheme Abstrakt \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -derivedDataPath .build/DerivedData \
            -quiet \
            CODE_SIGNING_ALLOWED=NO

      - name: Run Tests
        run: |
          xcodebuild test \
            -project Abstrakt.xcodeproj \
            -scheme Abstrakt \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -derivedDataPath .build/DerivedData \
            -quiet \
            CODE_SIGNING_ALLOWED=NO || echo "No test target configured yet"
